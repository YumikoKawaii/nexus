replicaCount: 1

image:
  repository: ghcr.io/yumikokawaii/nexus
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 4317

# Rendered verbatim into a config.yaml ConfigMap and mounted at /etc/nexus/config.yaml.
config:
  kafkaBrokers: []
  outputTopicPrefix: otel.flat
  logLevel: info

  otlp:
    addr: ":4317"

  # Topic-suffix allowlist; empty publishes all.
  topics:
    enabled: []

  producer:
    mode: async
    acks: local
    retryMax: 3
    retryBackoff: 100ms
    flushMessages: 1000
    flushBytes: 1048576
    flushFrequency: 2s

# Extra env vars sourced from existing Secrets (e.g. SASL credentials).
extraEnv: []
extraEnvFrom: []
