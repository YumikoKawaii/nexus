replicaCount: 1

image:
  repository: ghcr.io/yumikokawaii/nexus
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  grpcPort: 4317
  httpPort: 4318

# Application configuration. Rendered into a ConfigMap and exposed as env vars.
# Values here map 1:1 to the env vars nexus reads (see .env.example).
config:
  KAFKA_BROKERS: ""
  OUTPUT_TOPIC_PREFIX: otel.flat
  LOG_LEVEL: info

  OTLP_GRPC_ADDR: ":4317"
  OTLP_HTTP_ADDR: ":4318"

  PRODUCER_MODE: async
  PRODUCER_ACKS: local
  PRODUCER_RETRY_MAX: "3"
  PRODUCER_RETRY_BACKOFF: 100ms
  PRODUCER_FLUSH_MESSAGES: "1000"
  PRODUCER_FLUSH_BYTES: "1048576"
  PRODUCER_FLUSH_FREQUENCY: 2s

# Extra env vars sourced from existing Secrets (e.g. SASL credentials).
extraEnv: []
extraEnvFrom: []
